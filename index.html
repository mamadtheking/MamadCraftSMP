<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mamad Craft SMP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #050805;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(0,255,80,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,80,.035) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 12s linear infinite;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes gridMove {
      from { background-position: 0 0; }
      to { background-position: 40px 40px; }
    }

    header {
      text-align: center;
      padding: 70px 20px 45px;
    }

    .crown {
      font-size: 70px;
      animation: crownFloat 2.5s ease-in-out infinite;
    }

    @keyframes crownFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 48px;
      color: #39ff75;
      text-shadow: 0 0 20px rgba(57,255,117,.5);
      margin: 10px 0;
    }

    .subtitle {
      color: #b8c7bc;
      font-size: 18px;
    }

    .container {
      width: min(900px, 92%);
      margin: auto;
    }

    .card {
      background: rgba(10,18,11,.88);
      border: 1px solid rgba(57,255,117,.25);
      border-radius: 20px;
      padding: 28px;
      margin: 25px 0;
      box-shadow: 0 0 30px rgba(0,255,80,.06);
      transition: .25s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(57,255,117,.5);
    }

    .card h2 {
      color: #39ff75;
      margin-bottom: 18px;
    }

    .ip {
      background: #020402;
      border: 1px solid #18351f;
      padding: 15px;
      border-radius: 12px;
      font-family: monospace;
      direction: ltr;
      text-align: center;
      font-size: 17px;
      margin: 15px 0;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      background: #39ff75;
      color: #031006;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      transform: scale(1.02);
      box-shadow: 0 0 20px rgba(57,255,117,.35);
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 20px;
      margin-top: 15px;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      display: inline-block;
      background: #777;
    }

    .online {
      background: #39ff75;
      box-shadow: 0 0 12px #39ff75;
    }

    .offline {
      background: #ff3b3b;
      box-shadow: 0 0 12px #ff3b3b;
    }

    .unknown {
      background: #ffd43b;
      box-shadow: 0 0 12px #ffd43b;
    }

    #players {
      color: #b8c7bc;
      font-size: 16px;
    }

    #lastCheck {
      text-align: center;
      color: #718078;
      font-size: 12px;
      margin-top: 12px;
    }

    .about {
      line-height: 2;
      color: #d4ddd6;
    }

    footer {
      text-align: center;
      color: #647068;
      padding: 35px 20px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 34px;
      }

      .crown {
        font-size: 55px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="crown">👑</div>
    <h1>Mamad Craft SMP</h1>
    <p class="subtitle">سرور ماینکرفت ما 😎</p>
  </header>

  <main class="container">

    <section class="card">
      <h2>🎮 وضعیت سرور</h2>

      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">⏳ در حال بررسی...</span>
        <span id="players"></span>
      </div>

      <p id="lastCheck">آخرین بررسی: —</p>
    </section>

    <section class="card">
      <h2>🌐 آدرس سرور</h2>

      <div class="ip" id="serverIP">
        mamadcraftsmp.aternos.me
      </div>

      <button onclick="copyIP()">📋 کپی آدرس سرور</button>
    </section>

    <section class="card">
      <h2>👑 درباره Mamad Craft SMP</h2>

      <p class="about">
        به Mamad Craft SMP خوش اومدی! 🎮<br>
        اینجا می‌تونی با دوستات بازی کنی، بسازی و کلی ماجرا داشته باشی.
      </p>
    </section>

  </main>

  <footer>
    © 2026 Mamad Craft SMP
  </footer>

  <script>
    const SERVER_IP = "mamadcraftsmp.aternos.me";

    async function checkServer() {
      const statusDot = document.getElementById("statusDot");
      const statusText = document.getElementById("statusText");
      const players = document.getElementById("players");
      const lastCheck = document.getElementById("lastCheck");

      statusText.textContent = "⏳ در حال بررسی...";
      players.textContent = "";

      try {
        const response = await fetch(
          "https://api.mcstatus.io/v2/status/java/" +
          SERVER_IP +
          "?timeout=5"
        );

        if (!response.ok) {
          throw new Error("API Error");
        }

        const data = await response.json();

        if (data.online === true) {

          statusDot.className = "dot online";
          statusText.textContent = "🟢 ONLINE";

          if (data.players) {
            const online = data.players.online ?? 0;
            const max = data.players.max ?? "?";

            players.textContent = `👥 ${online} / ${max}`;
          }

        } else {

          statusDot.className = "dot offline";
          statusText.textContent = "🔴 OFFLINE";
          players.textContent = "👥 0";

        }

        const now = new Date();

        lastCheck.textContent =
          "آخرین بررسی: " +
          now.toLocaleTimeString("fa-IR");

      } catch (error) {

        statusDot.className = "dot unknown";
        statusText.textContent = "🟡 خطا در بررسی";
        players.textContent = "";

        lastCheck.textContent =
          "اتصال به سرویس بررسی وضعیت ناموفق بود.";
      }
    }

    function copyIP() {
      navigator.clipboard.writeText(SERVER_IP);

      const button = document.querySelector("button");
      const oldText = button.textContent;

      button.textContent = "✅ کپی شد!";

      setTimeout(() => {
        button.textContent = oldText;
      }, 1500);
    }

    checkServer();

    // بررسی هر 30 ثانیه
    setInterval(checkServer, 30000);
  </script>

</body>
</html>
