<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mamad Craft SMP</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #050805;
  color: white;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    linear-gradient(rgba(0,255,100,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,100,.04) 1px, transparent 1px);
  background-size: 45px 45px;
  animation: gridMove 10s linear infinite;
  pointer-events: none;
}

@keyframes gridMove {
  from { transform: translateY(0); }
  to { transform: translateY(45px); }
}

header {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
}

.hero {
  animation: fadeUp 1s ease;
}

.crown {
  font-size: 70px;
  animation: float 3s ease-in-out infinite;
  filter: drop-shadow(0 0 20px #00ff66);
}

h1 {
  font-size: clamp(45px, 9vw, 100px);
  color: #00ff66;
  text-shadow:
    0 0 10px #00ff66,
    0 0 30px #00ff66;
  margin: 15px 0;
}

.subtitle {
  color: #b7ffca;
  font-size: 20px;
  margin-bottom: 30px;
}

.buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
}

button,
.btn {
  border: none;
  text-decoration: none;
  padding: 14px 25px;
  border-radius: 12px;
  background: #00ff66;
  color: #001a08;
  font-weight: bold;
  cursor: pointer;
  transition: .25s;
}

button:hover,
.btn:hover {
  transform: translateY(-4px) scale(1.04);
  box-shadow: 0 0 25px #00ff66;
}

section {
  max-width: 1000px;
  margin: auto;
  padding: 80px 25px;
}

.title {
  text-align: center;
  color: #00ff66;
  font-size: 38px;
  margin-bottom: 35px;
  text-shadow: 0 0 15px #00ff66;
}

.card {
  background: rgba(10,25,14,.8);
  border: 1px solid rgba(0,255,100,.25);
  border-radius: 20px;
  padding: 30px;
  margin-bottom: 25px;
  transition: .3s;
  box-shadow: 0 0 25px rgba(0,255,100,.06);
}

.card:hover {
  transform: translateY(-7px);
  border-color: #00ff66;
  box-shadow: 0 0 30px rgba(0,255,100,.2);
}

.server-box {
  text-align: center;
}

.ip {
  margin: 20px auto;
  padding: 15px;
  background: #020402;
  border-radius: 12px;
  color: #00ff66;
  font-size: 19px;
  max-width: 500px;
  word-break: break-all;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px;
  border-radius: 20px;
  background: #101510;
  margin: 15px 0;
  font-weight: bold;
}

.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #888;
}

.online {
  background: #00ff66;
  box-shadow: 0 0 15px #00ff66;
}

.offline {
  background: #ff3333;
  box-shadow: 0 0 15px #ff3333;
}

#statusText {
  color: #aaa;
}

#players {
  color: #aaa;
}

footer {
  text-align: center;
  padding: 35px;
  color: #777;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media(max-width:600px) {
  .crown {
    font-size: 55px;
  }

  .subtitle {
    font-size: 17px;
  }

  section {
    padding: 55px 18px;
  }
}
</style>
</head>

<body>

<header>
  <div class="hero">
    <div class="crown">👑</div>

    <h1>MAMAD CRAFT</h1>

    <p class="subtitle">
      Welcome to Mamad Craft SMP
    </p>

    <div class="buttons">
      <a class="btn" href="#server">ورود به سرور</a>

      <a class="btn"
      href="https://rubika.ir/joinc/FGABAJCA0DAKVOBPRVBXOMADGYOKACZG"
      target="_blank">
        روبیکا
      </a>
    </div>
  </div>
</header>

<section id="server">

  <h2 class="title">وضعیت سرور</h2>

  <div class="card server-box">

    <h2>🎮 Mamad Craft SMP</h2>

    <div class="ip">
      mamadcraftsmp.aternos.me
    </div>

    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">در حال بررسی...</span>
      <span id="players"></span>
    </div>

    <br>

    <button onclick="copyIP()">
      📋 کپی IP
    </button>

  </div>

</section>

<section>

  <h2 class="title">درباره سرور</h2>

  <div class="card">
    <h2>🌍 SMP</h2>
    <br>
    <p>
      به دنیای Mamad Craft خوش اومدی!
      با دوستات بازی کن، بساز و ماجراجویی کن.
    </p>
  </div>

</section>

<footer>
  👑 Mamad Craft SMP
</footer>

<script>

const SERVER_IP = "mamadcraftsmp.aternos.me";

async function checkServer() {

  const statusText = document.getElementById("statusText");
  const statusDot = document.getElementById("statusDot");
  const players = document.getElementById("players");

  statusText.textContent = "در حال بررسی...";
  players.textContent = "";

  try {

    const response = await fetch(
      "https://api.mcsrvstat.us/3/" + SERVER_IP
    );

    const data = await response.json();

    if (data.online) {

      statusText.textContent = "🟢 ONLINE";
      statusText.style.color = "#00ff66";

      statusDot.className = "dot online";

      if (data.players) {
        players.textContent =
          " • " + data.players.online +
          " / " + data.players.max +
          " Players";
      }

    } else {

      statusText.textContent = "🔴 OFFLINE";
      statusText.style.color = "#ff3333";

      statusDot.className = "dot offline";

    }

  } catch (error) {

    statusText.textContent = "⚠️ خطا در بررسی";
    statusText.style.color = "#ffaa00";

    statusDot.className = "dot";

  }
}

function copyIP() {

  navigator.clipboard.writeText(SERVER_IP);

  alert("IP سرور کپی شد! 🎮");

}

checkServer();

setInterval(checkServer, 30000);

</script>

</body>
</html>
